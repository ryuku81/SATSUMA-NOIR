<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOURNAL — SATSUMA NOIR</title>
  <meta name="description" content="SATSUMA NOIR の読みもの。季節のひと皿、つくり手の手仕事、照国本店の日々をお届けします。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=72" />
</head>
<body>
  <main class="page">
    <section class="journal">
      <header class="journal__head">
        <h1 class="journal__title">JOURNAL</h1>
      </header>

      <a class="journal-feature" href="journal-detail.html">
        <div class="journal-feature__media journal-feature__media--triptych">
          <img class="journal-feature__shot" src="images/rare-cheesecake.png" alt="" loading="eager" />
          <img class="journal-feature__shot" src="images/basque-cheesecake.png" alt="" loading="eager" />
          <img class="journal-feature__shot" src="images/berry-rare-cheesecake.png" alt="" loading="eager" />
          <span class="journal-feature__label">SATSUMA NOIR</span>
        </div>
        <h2 class="journal-feature__title">初夏のひと皿。軽やかに溶ける、レアチーズの季節がやってきた。</h2>
        <time class="journal-feature__date">2026.06.24</time>
      </a>

      <div class="journal-tl__list" id="journalList"></div>

      <nav class="journal-pager" id="journalPager" aria-label="ページ送り">
        <button class="btn btn--ghost journal-pager__btn" id="journalPrev" type="button">前のページ</button>
        <span class="journal-pager__info" id="journalInfo">1/1</span>
        <button class="btn btn--ghost journal-pager__btn" id="journalNext" type="button">次のページ</button>
      </nav>

      <div class="section-more">
        <a href="index.html#about" class="btn btn--ghost">トップにもどる</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=1"></script>

  <script src="settings.js?v=4"></script>

  <script src="store.js?v=5"></script>

  <script src="app.js?v=15"></script>

  <script>
    // ジャーナル一覧：ダミーデータ＋クライアントサイドのページ送り
    (function () {
      const IMGS = [
        "terukuni-store.jpg", "basque-cheesecake.png", "noir-tablette.png", "souffle-cheesecake.png",
        "berry-rare-cheesecake.png", "newyork-cheesecake.png", "italian-tiramisu.png", "baked-cheesecake.png",
        "kurogoma-financier.png", "gateau-chocolat.png", "opera.png", "black-forest.png",
        "rare-cheesecake.png", "basque-cheese-tart.png", "truffle-collection.png", "cacao-nib-sable.png",
      ];
      const TITLES = [
        "照国本店、はじまりの話。“目が届く範囲”で、ひとつひとつ手仕事で。",
        "熟成冷凍という選択。解凍後がいちばんの食べごろになる理由。",
        "週末のための、深い甘さ。SATSUMA NOIR が大切にしていること。",
        "口どけを設計する。空気を含ませた、やわらかなスフレのこと。",
        "コーヒーと余韻。大人のためのティラミスの、静かな楽しみ方。",
        "甘酸っぱさを重ねて。ベリーレアチーズに込めた、春の華やぎ。",
        "湯せん焼きという手間。しっとり濃密なニューヨークの王道。",
        "黒ごまという深み。和の素材が描く、もうひとつのNOIR。",
        "ガトーショコラの夜。ひと口で満たされる、濃い甘さの設計。",
        "焼き上がりの音を聴く。バスクの表面が語る、ほろ苦さのこと。",
        "解凍5分の違い。半解凍とフル解凍、ふたつの食感のあいだで。",
        "器を選ぶ。冷たい一皿を、いちばん美しく見せる温度のこと。",
        "ブラックフォレストの記憶。チェリーと闇のような甘さ。",
        "オペラを重ねる。何層もの手仕事が生む、端正な一切れ。",
        "タルト生地の役割。サクサクと濃厚の、心地よいコントラスト。",
        "カカオニブの食感。香ばしさをアクセントに添えるということ。",
        "週末の朝に。コーヒーとともに過ごす、ゆるやかな解凍時間。",
        "贈りものとして。箱を開ける瞬間まで含めた、味わいの設計。",
        "鹿児島の風土と。地のものに寄り添う、素材選びの話。",
        "“目が届く範囲”の意味。原点回帰でたどり着いた、いまの形。",
        "甘さの輪郭。引き算でこそ立ちのぼる、上質さについて。",
        "トリュフという小宇宙。ひと粒に込めた、濃密なひととき。",
        "ボンボンショコラの設計図。香りと食感のレイヤーを読む。",
        "フィナンシェの黄金比。焦がしバターが描く、香ばしい余白。",
        "夏のひんやり。冷凍庫から取り出す、いちばん贅沢な数分間。",
        "静けさを味わう。夜のように深い、SATSUMA NOIR の甘さ。",
        "手土産の正解。相手を思う時間ごと、包んでお渡しすること。",
        "余韻を残す。ひと口ごとに広がる、深い甘さの行方。",
        "季節を映す一皿。移ろいに合わせて変わる、限定の楽しみ。",
        "つくり手の一日。仕込みからカフェの灯りまで、照国本店の日々。",
      ];
      const CATS = ["Store", "Craft", "Philosophy", "Recipe", "Season's Plate"];

      // 2026.06.10 を起点に、過去へ向かって日付を割り当てる（ダミー）
      function dateFor(i) {
        let y = 2026, m = 6, d = 10;
        let total = m * 1 + 0;
        // i 件ぶん、約11日ずつ遡る
        let day = d - i * 11, mon = m, year = y;
        while (day < 1) { mon -= 1; if (mon < 1) { mon = 12; year -= 1; } day += 30; }
        const p = (n) => String(n).padStart(2, "0");
        return year + "." + p(mon) + "." + p(day);
      }

      const POSTS = TITLES.map((t, i) => ({
        title: t,
        img: "images/" + IMGS[i % IMGS.length],
        cat: CATS[i % CATS.length],
        date: dateFor(i),
      }));

      const PER_PAGE = 6;
      const totalPages = Math.max(1, Math.ceil(POSTS.length / PER_PAGE));
      let page = 1;

      const list = document.getElementById("journalList");
      const info = document.getElementById("journalInfo");
      const prev = document.getElementById("journalPrev");
      const next = document.getElementById("journalNext");
      if (!list) return;

      const WD = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
      function render() {
        const start = (page - 1) * PER_PAGE;
        const slice = POSTS.slice(start, start + PER_PAGE);
        list.innerHTML = slice.map((p) => {
          const [y, m, d] = p.date.split(".");
          const wd = WD[new Date(`${y}-${m}-${d}T00:00:00`).getDay()];
          return `
          <a class="jtl" href="journal-detail.html">
            <div class="jtl__when"><span class="jtl__ym">${y}.${m}</span><span class="jtl__d">${d} ${wd}</span></div>
            <div class="jtl__card">
              <div class="jtl__media"><img src="${p.img}" alt="" loading="lazy" /></div>
              <div><span class="jtl__cat">${p.cat}</span><h3 class="jtl__title">${p.title}</h3></div>
            </div>
          </a>`;
        }).join("");
        info.textContent = page + "/" + totalPages;
        prev.disabled = page <= 1;
        next.disabled = page >= totalPages;
      }

      function go(p) {
        page = Math.min(totalPages, Math.max(1, p));
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      prev.addEventListener("click", () => go(page - 1));
      next.addEventListener("click", () => go(page + 1));
      render();
    })();
  </script>
</body>
</html>
