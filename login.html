<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOGIN — SATSUMA NOIR</title>
  <meta name="description" content="ログイン・会員登録。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="auth-page">
      <div class="auth-page__box">
        <p class="auth-modal__brand">SATSUMA NOIR</p>

        <div class="auth-tabs">
          <button class="auth-tab is-active" data-tab="login">ログイン</button>
          <button class="auth-tab" data-tab="signup">会員登録</button>
        </div>

        <!-- Login -->
        <form class="auth-form is-active" data-form="login" onsubmit="return false;">
          <label class="field">
            <span>メールアドレス</span>
            <input type="email" placeholder="mail@example.com" required />
          </label>
          <label class="field">
            <span>パスワード</span>
            <input type="password" placeholder="••••••••" required />
          </label>
          <a href="#" class="auth-form__forgot">パスワードをお忘れですか？</a>
          <p class="auth-form__test">テスト用アカウント：<br />member@test.com / member123</p>
          <button type="submit" class="btn btn--primary btn--full">ログインする</button>
          <p class="auth-form__switch">アカウントをお持ちでない方は <button type="button" data-goto="signup">会員登録</button></p>
        </form>

        <!-- Signup -->
        <form class="auth-form" data-form="signup" onsubmit="return false;">
          <label class="field">
            <span>お名前</span>
            <input type="text" placeholder="鈴木 花子" required />
          </label>
          <label class="field">
            <span>メールアドレス</span>
            <input type="email" placeholder="mail@example.com" required />
          </label>
          <label class="field">
            <span>パスワード</span>
            <input type="password" placeholder="8文字以上" minlength="8" required />
          </label>
          <label class="field-check">
            <input type="checkbox" required />
            <span><a href="#">利用規約</a>・<a href="#">プライバシーポリシー</a>に同意します</span>
          </label>
          <button type="submit" class="btn btn--primary btn--full">登録する</button>
          <p class="auth-form__switch">すでにアカウントをお持ちの方は <button type="button" data-goto="login">ログイン</button></p>
        </form>
      </div>
    </section>
  </main>

  <script src="settings.js"></script>

  <script src="store.js"></script>

  <script src="app.js"></script>
</body>
</html>
