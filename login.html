<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOGIN — SATSUMA NOIR</title>
  <meta name="description" content="ログイン・会員登録。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=170" />
</head>
<body>
  <main class="page">
    <section class="auth-page">
      <div class="auth-page__box">
        <p class="auth-modal__brand">SATSUMA NOIR</p>

        <div class="auth-tabs">
          <button class="auth-tab is-active" data-tab="login">ログイン</button>
          <button class="auth-tab" data-tab="signup">会員登録</button>
        </div>

        <!-- Login -->
        <form class="auth-form is-active" data-form="login" onsubmit="return false;">
          <label class="field">
            <span>メールアドレス</span>
            <input type="email" placeholder="mail@example.com" required />
          </label>
          <label class="field">
            <span>パスワード</span>
            <input type="password" placeholder="••••••••" required />
          </label>
          <button type="button" class="auth-form__forgot" data-goto="request-reset">パスワードをお忘れですか？</button>
          <p class="auth-form__test">はじめての方は「会員登録」からアカウントを作成してください。</p>
          <button type="submit" class="btn btn--primary btn--full">ログインする</button>
          <p class="auth-form__switch">アカウントをお持ちでない方は <button type="button" data-goto="signup">会員登録</button></p>
        </form>

        <!-- Signup -->
        <form class="auth-form" data-form="signup" onsubmit="return false;">
          <label class="field">
            <span>お名前</span>
            <input type="text" placeholder="鈴木 花子" required />
          </label>
          <label class="field">
            <span>メールアドレス</span>
            <input type="email" placeholder="mail@example.com" required />
          </label>
          <label class="field">
            <span>パスワード</span>
            <input type="password" placeholder="8文字以上" minlength="8" required />
          </label>
          <label class="field-check">
            <input type="checkbox" required />
            <span><a href="#">プライバシーポリシー</a>に同意します</span>
          </label>
          <button type="submit" class="btn btn--primary btn--full">登録する</button>
          <p class="auth-form__switch">すでにアカウントをお持ちの方は <button type="button" data-goto="login">ログイン</button></p>
        </form>

        <!-- Request password reset -->
        <form class="auth-form" data-form="request-reset" onsubmit="return false;">
          <p class="auth-form__test">登録済みのメールアドレスに、パスワード再設定用のリンクを送信します。</p>
          <label class="field">
            <span>メールアドレス</span>
            <input type="email" placeholder="mail@example.com" required />
          </label>
          <button type="submit" class="btn btn--primary btn--full">再設定メールを送る</button>
          <p class="auth-form__switch"><button type="button" data-goto="login">ログインに戻る</button></p>
        </form>

        <!-- Update password -->
        <form class="auth-form" data-form="reset-password" onsubmit="return false;">
          <p class="auth-form__test">新しいパスワードを入力してください。</p>
          <label class="field">
            <span>新しいパスワード</span>
            <input type="password" placeholder="8文字以上" minlength="8" required />
          </label>
          <label class="field">
            <span>新しいパスワード（確認）</span>
            <input type="password" placeholder="もう一度入力" minlength="8" required />
          </label>
          <button type="submit" class="btn btn--primary btn--full">パスワードを更新する</button>
        </form>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=3"></script>
  <script src="auth.js?v=4"></script>

  <script src="settings.js"></script>

  <script src="store.js?v=5"></script>

  <script src="app.js?v=38"></script>
</body>
</html>
